<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/6250a72f13.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <div class="music-player">
            <nav>
                <div class="circle">
                    <i class="fa-solid fa-angle-left"></i>
                </div>
                <div class="circle">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </nav>
            <img src="media/Ruthless.jpg" alt="Ruthless Album Cover" class="song-img">
            <h1>Ruthless</h1>
            <p>Artist Name: Neffex</p>

            <audio id="song">
                <source src="media/Ruthless - NEFFEX.mp3" type="audio/mpeg">
            </audio>
            <input type="range" value="0" id="progress">

            <div class="volume" role="group" aria-label="Volume controls">
                <button class="volume-btn" id="volumeBtn" aria-label="Mute or unmute" type="button">
                    <i class="fa-solid fa-volume-high" id="volumeIcon" aria-hidden="true"></i>
                </button>
                <input type="range" id="volume" min="0" max="100" value="70" aria-label="Volume">
            </div>

            <div class="controls">

                <div><i class="fa-solid fa-backward"></i></div>
                <div onclick="playPause()"><i class="fa-solid fa-play" id="ctrlIcon"></i></div>
                <div><i class="fa-solid fa-forward"></i></div>
            </div>
        </div>
    </div>
    

    <script src="script.js"></script>
</body>
</html>
